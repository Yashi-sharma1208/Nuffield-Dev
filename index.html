<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuffield Health Support</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f3f8f6;
        }

        header {
            background: #2a6f55;
            padding: 20px;
            text-align: center;
            color: white;
            font-size: 22px;
            font-weight: bold;
        }

        .hero {
            text-align: center;
            padding: 40px;
        }

        .hero img {
            width: 120px;
            margin-bottom: 20px;
        }

        .info-box {
            max-width: 700px;
            background: white;
            padding: 20px;
            margin: 0 auto;
            border-radius: 10px;
            text-align: center;
            font-size: 18px;
            color: #444;
            box-shadow: 0px 2px 8px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>

    <header>
        Nuffield Health • UAT
    </header>

    <div class="hero">
        <img src="https://cdn-icons-png.flaticon.com/512/2966/2966327.png" alt="Hospital Icon">
        <div class="info-box">
            Welcome to Nuffield Health Support.
            


            You can use the chat button (bottom-right) to ask questions or book an appointment.
            


            Our support bot will assist you shortly.
        </div>
    </div>

<script>
(function () {

    // ── 1. ALWAYS HIDE SALESFORCE BUTTON ─────────────────────────────
    const style = document.createElement('style');

    style.textContent = `
        #embeddedMessagingConversationButton,
        .embeddedMessagingConversationButtonWrapper,
        #embeddedMessagingFrame.isMinimized{
            display:none !important;
            pointer-events:none !important;
        }

        /* Desktop */
        #customChatBtn{
            position:fixed;
            bottom:24px;
            right:24px;

            width:220px;
            height:90px;

            overflow:hidden;

            z-index:99999;
            cursor:pointer;

            display:flex;
            align-items:center;
            justify-content:center;
        }

        #customChatBtn img{
            width:100%;
            height:100%;
            object-fit:contain;
            display:block;
        }

        /* Mobile */
        @media(max-width:700px){

            #customChatBtn{
                width:90px;
                height:90px;

                border-radius:50%;

                background:#14b320;

                right:20px;
                bottom:20px;

                box-shadow:
                    0 6px 18px rgba(0,0,0,.25);

                padding:12px;
            }

            #customChatBtn img{
                width:100%;
                height:100%;
                object-fit:contain;
            }
        }
    `;

    document.head.appendChild(style);

    // ── 2. CREATE CUSTOM BUTTON ─────────────────────────────────────
    const chatBtn = document.createElement('div');

    chatBtn.id = 'customChatBtn';
    chatBtn.title = 'Talk to us';

    const img = document.createElement('img');

    img.src =
        'https://nuffieldhealth-crm--mintdev.sandbox.my.site.com/resource/1779698354000/Agentforce_chat_icon';

    chatBtn.appendChild(img);

    document.body.appendChild(chatBtn);

    // ── 3. SHOW / HIDE ──────────────────────────────────────────────
    function showCustomBtn() {
        const btn = document.getElementById('customChatBtn');
        if (btn) btn.style.display = 'flex';
    }

    function hideCustomBtn() {
        const btn = document.getElementById('customChatBtn');
        if (btn) btn.style.display = 'none';
    }

    // ── 4. OPEN CHAT ────────────────────────────────────────────────
    function openEmbeddedChat() {

        try {

            embeddedservice_bootstrap
                .utilAPI
                .launchChat();

        } catch (e) {

            console.warn(
                'launchChat failed → fallback'
            );

            const btn =
                document.getElementById(
                    'embeddedMessagingConversationButton'
                );

            if (btn) {
                btn.style.display = 'block';
                btn.click();
                btn.style.display = 'none';
            } else {
                waitForEmbeddedBtn();
            }
        }

        hideCustomBtn();
    }

    function waitForEmbeddedBtn() {

        let attempts = 0;

        const interval = setInterval(() => {

            attempts++;

            const btn =
                document.getElementById(
                    'embeddedMessagingConversationButton'
                );

            if (btn) {

                clearInterval(interval);

                btn.style.display = 'block';

                btn.click();

                btn.style.display = 'none';

            } else if (attempts > 20) {

                clearInterval(interval);

                showCustomBtn();
            }

        }, 300);
    }

    chatBtn.addEventListener(
        'click',
        openEmbeddedChat
    );

    chatBtn.addEventListener(
        'keydown',
        (e) => {

            if (
                e.key === 'Enter' ||
                e.key === ' '
            ) {

                e.preventDefault();

                openEmbeddedChat();
            }
        }
    );

    // ── 5. CHAT EVENTS ──────────────────────────────────────────────
    window.addEventListener(
        'onEmbeddedMessagingWindowMinimized',
        showCustomBtn
    );

    window.addEventListener(
        'onEmbeddedMessagingWindowClosed',
        showCustomBtn
    );

    window.addEventListener(
        'onEmbeddedMessagingWindowMaximized',
        hideCustomBtn
    );

    // ── 6. CXONE + SALESFORCE INIT (UNCHANGED) ──────────────────────

    function startCxoneChat(firstName, transcriptId, skillId) {

        (function (n, u) {

            window.CXoneDfo = n;

            window[n] =
                window[n] ||
                function () {
                    (
                        window[n].q =
                        window[n].q ||
                        []
                    ).push(arguments);
                };

            e = document.createElement('script');

            e.type = 'module';

            e.src =
                u +
                '?' +
                Math.round(
                    Date.now() /
                    1000 /
                    3600
                );

            document.head.appendChild(e);

        })(
            'cxone',
            'https://web-modules-de-uk1.niceincontact.com/loader/1/loader.js'
        );

        cxone('init', '1152');

        cxone(
            'chat',
            'init',
            1152,
            'chat_77cdeb00-0c80-41cb-874b-0e7df1067e0c'
        );

        cxone(
            'chat',
            'setCustomerName',
            firstName
        );

        cxone(
            'chat',
            'setCustomField',
            'nuffskill',
            skillId
        );

        cxone(
            'chat',
            'openChatWindow'
        );
    }

    function getSkillId(text){

        text=text.toLowerCase();

        if(text.includes('appointment cancellation'))
            return '31531982';

        if(text.includes('appointment booking'))
            return '29204808';

        return '29204809';
    }

    function initEmbeddedMessaging(){

        try{

            embeddedservice_bootstrap
                .settings
                .language='en_US';

            embeddedservice_bootstrap.init(
                '00DS900000DRZFB',
                'Agentforce_Customer_Support',
                'https://nuffieldhealth-crm--mintdev.sandbox.my.site.com/ESWAgentforceCustomerSu1769670343106',
                {
                    scrt2URL:
                    'https://nuffieldhealth-crm--mintdev.sandbox.my.salesforce-scrt.com'
                }
            );

        }catch(err){

            console.error(err);
        }
    }

    const sfScript =
        document.createElement('script');

    sfScript.src =
        'https://nuffieldhealth-crm--mintdev.sandbox.my.site.com/ESWAgentforceCustomerSu1769670343106/assets/js/bootstrap.min.js';

    sfScript.onload =
        initEmbeddedMessaging;

    document.body.appendChild(
        sfScript
    );

})();
</script>

</body>
</html>
